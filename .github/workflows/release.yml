name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.4

      - name: Verify Terraform component and module
        run: |
          tofu fmt -check -recursive components/serverless-ca
          tofu -chdir=components/serverless-ca init -backend=false -input=false
          tofu -chdir=components/serverless-ca validate
          tofu -chdir=components/serverless-ca test -no-color
          tofu -chdir=components/serverless-ca/modules/ca init -backend=false -input=false
          tofu -chdir=components/serverless-ca/modules/ca validate
          tofu -chdir=components/serverless-ca/modules/ca test -no-color

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: components/serverless-ca/modules/ca/modules/terraform-aws-ca-lambda/requirements-dev.lock

      - name: Verify Python source and dependencies
        working-directory: components/serverless-ca/modules/ca
        run: |
          python -m pip install --require-hashes --requirement modules/terraform-aws-ca-lambda/requirements-dev.lock
          pytest -q modules/terraform-aws-ca-lambda/unittests
          for lock in modules/terraform-aws-ca-lambda/lambda_code/*/requirements.lock; do
            pip-audit --require-hashes --requirement "$lock"
          done
          bandit -q -r modules/terraform-aws-ca-lambda/lambda_code modules/terraform-aws-ca-lambda/utils

      - name: Set up arm64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Build and verify Lambda packages
        run: |
          scripts/build-serverless-ca-lambdas.sh "${RUNNER_TEMP}/build-a"
          scripts/build-serverless-ca-lambdas.sh "${RUNNER_TEMP}/build-b"
          diff -u "${RUNNER_TEMP}/build-a/SHA256SUMS" "${RUNNER_TEMP}/build-b/SHA256SUMS"
          mkdir -p dist
          cp "${RUNNER_TEMP}/build-a/"*.zip dist/

      - name: Build and verify component package
        run: |
          scripts/package-serverless-ca-component.py "${RUNNER_TEMP}/serverless-ca-component-a.zip"
          scripts/package-serverless-ca-component.py "${RUNNER_TEMP}/serverless-ca-component-b.zip"
          test "$(sha256sum "${RUNNER_TEMP}/serverless-ca-component-a.zip" | cut -d " " -f 1)" = "$(sha256sum "${RUNNER_TEMP}/serverless-ca-component-b.zip" | cut -d " " -f 1)"
          cp "${RUNNER_TEMP}/serverless-ca-component-a.zip" dist/serverless-ca-component.zip

      - name: Generate component SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: components/serverless-ca
          format: spdx-json
          output-file: dist/serverless-ca-component.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate Lambda package SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/serverless-ca-lambdas.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Record build provenance and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/write-serverless-ca-provenance.py dist dist/provenance.json
          (cd dist && sha256sum -- * | grep -v ' SHA256SUMS$' | sort -k2 > SHA256SUMS)

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  promote-serverless-ca-artifacts:
    needs: package
    runs-on: ubuntu-latest
    environment: serverless-ca-artifact-promotion
    permissions:
      contents: read
      id-token: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
    steps:
      - name: Validate and download the published release
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = "9spokes/terraform-components"
          # RELEASE_TAG is supplied from github.ref_name at job scope.
          # shellcheck disable=SC2153
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

          release_metadata="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets)"
          release_tag="$(jq --raw-output '.tagName' <<<"$release_metadata")"
          test "$release_tag" = "$RELEASE_TAG"
          jq --exit-status '.isDraft == false and .isPrerelease == false' \
            <<<"$release_metadata" >/dev/null

          expected_assets=(
            create_root_ca-x86_64.zip
            create_root_ca-arm64.zip
            create_issuing_ca-x86_64.zip
            create_issuing_ca-arm64.zip
            root_ca_crl-x86_64.zip
            root_ca_crl-arm64.zip
            issuing_ca_crl-x86_64.zip
            issuing_ca_crl-arm64.zip
            tls_cert-x86_64.zip
            tls_cert-arm64.zip
            expiry-x86_64.zip
            expiry-arm64.zip
            notify-x86_64.zip
            notify-arm64.zip
            serverless-ca-component.zip
            serverless-ca-component.spdx.json
            serverless-ca-lambdas.spdx.json
            provenance.json
            SHA256SUMS
          )
          mkdir release
          printf '%s\n' "${expected_assets[@]}" | sort > release/expected-assets
          jq --raw-output '.assets[].name' <<<"$release_metadata" | sort > release/release-assets
          diff --unified=3 release/expected-assets release/release-assets

          while IFS= read -r asset; do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir release \
              --pattern "$asset"
          done < release/expected-assets

      - name: Verify release attestations and checksums
        run: |
          set -euo pipefail

          while IFS= read -r asset; do
            gh attestation verify "release/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done < release/expected-assets

          sed -E 's/^[[:xdigit:]]{64}  ([^[:space:]]+)$/\1/' \
            release/SHA256SUMS | sort > release/checksummed-assets
          grep --invert-match '^SHA256SUMS$' release/expected-assets \
            > release/expected-checksummed-assets
          diff --unified=3 release/expected-checksummed-assets release/checksummed-assets
          (cd release && sha256sum --strict --check SHA256SUMS)

      - name: Require applied promotion environment configuration
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$AWS_ROLE_ARN"
          test -n "$ARTIFACT_BUCKET"

      - name: Configure promotion credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Promote immutable release assets
        run: |
          set -euo pipefail

          manifest_entries="${RUNNER_TEMP}/promotion-manifest.ndjson"
          : > "$manifest_entries"

          while IFS= read -r asset; do
            test "$asset" != "SHA256SUMS"
            object_key="serverless-ca/releases/${RELEASE_TAG}/${asset}"
            sha256="$(awk -v asset="$asset" '$2 == asset { print $1 }' release/SHA256SUMS)"
            [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
            sha256_base64="$(printf '%s' "$sha256" | xxd -r -p | base64 -w0)"
            content_length="$(stat --format=%s "release/${asset}")"
            test "$content_length" -gt 0

            put_response="$(aws s3api put-object \
              --region "$AWS_REGION" \
              --bucket "$ARTIFACT_BUCKET" \
              --key "$object_key" \
              --body "release/${asset}" \
              --if-none-match '*' \
              --server-side-encryption AES256 \
              --output json)"
            version_id="$(jq --exit-status --raw-output \
              '.VersionId | strings | select(length > 0)' <<<"$put_response")"

            jq --null-input --compact-output \
              --arg asset_name "$asset" \
              --arg object_key "$object_key" \
              --arg version_id "$version_id" \
              --arg sha256 "$sha256" \
              --arg sha256_base64 "$sha256_base64" \
              --argjson content_length "$content_length" \
              --arg release_tag "$RELEASE_TAG" \
              --arg source_commit "$GITHUB_SHA" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow_run_id "$GITHUB_RUN_ID" \
              '{
                assetName: $asset_name,
                objectKey: $object_key,
                versionId: $version_id,
                sha256: $sha256,
                sha256Base64: $sha256_base64,
                contentLength: $content_length,
                releaseTag: $release_tag,
                sourceCommit: $source_commit,
                repository: $repository,
                workflowRunId: $workflow_run_id
              }' >> "$manifest_entries"

            printf 'Promoted filename=%s key=%s VersionId=%s\n' \
              "$asset" "$object_key" "$version_id"
          done < release/expected-checksummed-assets

          jq --sort-keys --slurp \
            '{schemaVersion: 1, objects: sort_by(.assetName)}' \
            "$manifest_entries" > release/promotion-manifest.json

          jq --exit-status \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_commit "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            '
              .schemaVersion == 1 and
              (.objects | type == "array" and length == 18) and
              ([.objects[].assetName] == ([.objects[].assetName] | sort)) and
              ([.objects[].assetName] | unique | length == 18) and
              all(.objects[];
                (.assetName | type == "string" and length > 0) and
                (.objectKey == ("serverless-ca/releases/" + $release_tag + "/" + .assetName)) and
                (.versionId | type == "string" and length > 0) and
                (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
                (.sha256Base64 | type == "string" and test("^[A-Za-z0-9+/]{43}=$")) and
                (.contentLength | type == "number" and . > 0) and
                (.releaseTag == $release_tag) and
                (.sourceCommit == $source_commit) and
                (.repository == $repository) and
                (.workflowRunId == $workflow_run_id)
              )
            ' release/promotion-manifest.json >/dev/null
          jq --raw-output '.objects[].assetName' release/promotion-manifest.json \
            > release/promoted-assets
          diff --unified=3 release/expected-checksummed-assets release/promoted-assets

          manifest_key="serverless-ca/releases/${RELEASE_TAG}/promotion-manifest.json"
          manifest_response="$(aws s3api put-object \
            --region "$AWS_REGION" \
            --bucket "$ARTIFACT_BUCKET" \
            --key "$manifest_key" \
            --body release/promotion-manifest.json \
            --if-none-match '*' \
            --server-side-encryption AES256 \
            --output json)"
          manifest_version_id="$(jq --exit-status --raw-output \
            '.VersionId | strings | select(length > 0)' <<<"$manifest_response")"
          printf 'Promoted filename=%s key=%s VersionId=%s\n' \
            promotion-manifest.json "$manifest_key" "$manifest_version_id"

          completion_key="serverless-ca/releases/${RELEASE_TAG}/SHA256SUMS"
          completion_response="$(aws s3api put-object \
            --region "$AWS_REGION" \
            --bucket "$ARTIFACT_BUCKET" \
            --key "$completion_key" \
            --body release/SHA256SUMS \
            --if-none-match '*' \
            --server-side-encryption AES256 \
            --output json)"
          completion_version_id="$(jq --exit-status --raw-output \
            '.VersionId | strings | select(length > 0)' <<<"$completion_response")"
          printf 'Promoted filename=%s key=%s VersionId=%s\n' \
            SHA256SUMS "$completion_key" "$completion_version_id"
